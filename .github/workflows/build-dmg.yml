name: Build and release DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing a Release needs write access to repository contents only.
permissions:
  contents: write

# Never cancel a run that may be uploading Release assets; queue instead.
concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      AZKI_BUILD_JOBS: '3'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assign build number
        id: number
        # BUILD_NUMBER in the repository is the base; every workflow run adds
        # one, so numbers only increase and no commit is written back. A re-run
        # of the same run keeps its number and replaces that Release's assets.
        run: |
          base="$(tr -d '\n\r' < BUILD_NUMBER)"
          case "$base" in ''|*[!0-9]*) echo 'BUILD_NUMBER must be a positive integer' >&2; exit 1;; esac
          number=$((base - 1 + GITHUB_RUN_NUMBER))
          version="$(tr -d '\n\r' < VERSION)"
          printf '%s\n' "$number" > BUILD_NUMBER
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build$number" >> "$GITHUB_OUTPUT"
          echo "Build $version ($number)"
      - name: Install build dependencies
        run: brew install python@3.12 meson ninja pkgconf glib gettext libffi pcre2 zstd dtc
      - name: Select build Python
        run: echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
      - name: Build app, DMG and corresponding sources
        run: ./scripts/build-dmg.sh dist
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.number.outputs.tag }}
          VERSION: ${{ steps.number.outputs.version }}
          NUMBER: ${{ steps.number.outputs.number }}
        run: |
          shopt -s nullglob
          dmg=(dist/*.dmg)
          sources=(dist/*-source.tar.gz dist/*-sources.tar.gz)
          test "${#dmg[@]}" -eq 1 || { echo 'Expected exactly one DMG' >&2; exit 1; }
          test "${#sources[@]}" -ge 1 || { echo 'Missing corresponding source archives' >&2; exit 1; }
          dmg_name="$(basename "${dmg[0]}")"
          checksum="$(shasum -a 256 "${dmg[0]}" | cut -d' ' -f1)"
          cat > notes.md <<EOF
          ## 下载 / Download

          **安装包：[\`${dmg_name}\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${dmg_name})**（只需下载这一个文件 / this is the only file you need）

          SHA-256: \`$checksum\`

          打开 DMG，把 Azki Simulator 拖到「应用程序」。需要 Apple Silicon 与 macOS 15 或更高版本。安装包未经 Developer ID 签名和 Apple 公证，首次打开时请通过系统提供的单个应用打开方式确认。

          Open the DMG and drag Azki Simulator to Applications. Requires Apple Silicon and macOS 15 or later. The package is not Developer ID signed or notarized.

          其余 \`*-source.tar.gz\` / \`*-engine-sources.tar.gz\` 是 GPL 要求随附的对应源码，普通用户无需下载。
          The \`*-source.tar.gz\` archives are the GPL corresponding sources and are optional.

          版本 ${VERSION}（构建 ${NUMBER}）· 提交 ${GITHUB_SHA:0:7}
          EOF
          # Draft first so a failed upload never leaves a partial public Release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${dmg[0]}" "${sources[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Azki Simulator $VERSION (build $NUMBER)" --notes-file notes.md
            gh release upload "$TAG" "${dmg[0]}" "${sources[@]}"
            gh release edit "$TAG" --draft=false --latest
          fi
          {
            echo "### Azki Simulator $VERSION (build $NUMBER)"
            echo
            echo "DMG: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$dmg_name"
          } >> "$GITHUB_STEP_SUMMARY"
